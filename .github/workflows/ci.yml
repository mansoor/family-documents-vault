name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only unless a job says otherwise: `images` alone pushes to GHCR
# (packages: write) and signs what it pushed (id-token: write), and
# `release` alone writes the tag's GitHub release (contents: write).
# Nothing pulls from GHCR: e2e builds its images. Every action is pinned
# by its commit, with the release it is in a comment beside it; Dependabot
# proposes moves (.github/dependabot.yml). The images jobs run in, and their
# services, are pinned by digest too; Dependabot does not see these, so move
# them with the same images in the Dockerfile and docker-compose.yml.
permissions:
  contents: read

jobs:
  guard:
    name: Private folders are absent
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Fail if docs-private/ or prototype/ were ever committed
        run: |
          if git ls-files | grep -E '^(docs-private|prototype)/' ; then
            echo "::error::Private documentation was committed. Remove it and rewrite history."
            exit 1
          fi
          echo "OK: no private folders in the tree."
      - name: Fail if phone-app files or signing keys were committed
        run: |
          if git ls-files | grep -E '(^|/)(android|ios|\.expo)/|\.(jks|keystore|p12|p8)$|(^|/)(google-services\.json|GoogleService-Info\.plist)$' ; then
            echo "::error::The phone app and its keys belong in the private repository."
            exit 1
          fi
          echo "OK: nothing from the phone app in the tree."

  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-24.04
    needs: guard
    services:
      postgres:
        image: postgres:16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
        env:
          POSTGRES_USER: fdv
          POSTGRES_PASSWORD: fdv
          POSTGRES_DB: fdv
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fdv"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_ADMIN_URL: postgres://fdv:fdv@localhost:5432/fdv
      S3_TEST_ENDPOINT: http://localhost:9000
      S3_TEST_KEY: fdv
      S3_TEST_SECRET: fdv-minio-test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # pg_dump and psql of the server's major version, as the worker image
      # pairs them: a newer pg_dump writes dumps PostgreSQL 16 cannot load.
      - name: Install OCR and rendering tools, and PostgreSQL 16's client (for the worker's tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr poppler-utils imagemagick postgresql-client-16
      - name: Start Mailpit (SMTP for the notification tests)
        run: |
          docker run -d --name mailpit -p 1025:1025 -p 8025:8025 axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
          for i in $(seq 1 30); do
            curl -sf http://localhost:8025/api/v1/messages?limit=1 >/dev/null && break
            sleep 1
          done
      # MinIO no longer publishes its images (quay.io and Docker Hub both
      # refuse them, as of September 2026). VersityGW (Apache-2.0) speaks the
      # same S3 API over a plain directory, which is all these tests need.
      - name: Start an S3-compatible server (VersityGW) for the adapter tests
        run: |
          docker run -d --name s3 -p 9000:7070             -e ROOT_ACCESS_KEY=fdv -e ROOT_SECRET_KEY=fdv-minio-test             versity/versitygw:v1.8.0@sha256:30292fc2eeacc67a36993b01f7a7a5e3361a19cced0e80c1d71cfa2a4b0a2499 posix /tmp
          for i in $(seq 1 30); do
            # Any answer will do: without credentials it is a 403.
            curl -s -o /dev/null http://localhost:9000/ && break
            sleep 1
          done
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Known advisories in what the images ship (production dependencies):
      # a high or critical one fails a push or a pull request; low and
      # moderate ones are listed, for the next round of updates, and pass. On
      # a release tag it only warns: an advisory published after the commit
      # was reviewed must not stop the release of what was reviewed (fix it
      # in the next one).
      - name: No high or critical advisory in the production dependencies
        continue-on-error: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: pnpm audit --prod --audit-level high
      - name: A release tag is the version in package.json
        # The server reports package.json's version (stamped in at build),
        # so a tag that disagrees would publish images that lie about
        # what they are.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but package.json says $want. Bump the version before tagging."
            exit 1
          fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # A phone already in someone's pocket carries the client of one vault
      # tag; a server change that would break it fails here (5.2). Every app
      # at or above min_client_version in apps/api/src/phone-apps.json, each
      # with its own tag's client: fixed, or the minimum raised on purpose.
      - name: The client every supported phone app carries still works
        run: pnpm test:older-client --all-supported
      - run: pnpm build

  # The API client (MIT) as an app installs it: a tarball on each GitHub
  # release, installed by its URL (CL1). Packed and tried on every PR, so a
  # package that would not install or load is caught before it merges.
  client-package:
    name: The client's release tarball
    runs-on: ubuntu-24.04
    needs: guard
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm client:pack
      - name: Install it by URL with npm and pnpm, outside the workspace, and use it
        run: pnpm client:smoke npm pnpm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client-tarball
          path: packages/client/dist/fdv-client-*.tgz
          if-no-files-found: error
          retention-days: 7

  # A tag's GitHub release, with the client's tarball on it: a pre-release
  # for a -dev or -rc tag. Made once everything else on the tag has passed
  # and the images are pushed. The only job that may write to the
  # repository.
  release:
    name: GitHub release
    runs-on: ubuntu-24.04
    needs: [check, client-package, image-tests, images, e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # All history: whether the tag's commit is on main decides Latest.
          fetch-depth: 0
      - name: Is this the latest release?
        id: release
        run: |
          # The rule `latest` images follow (the images job): a tag with no
          # pre-release part, whose commit is on main, and the newest such
          # release there. Anything else never takes Latest from another.
          newest=$(git tag --merged origin/main --sort=-v:refname 'v*' | grep -v -- - | head -1)
          if [[ "$TAG" == *-* ]]; then
            echo "latest=false" >> "$GITHUB_OUTPUT"
          elif ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::notice::$TAG is not on main: not marked Latest."
            echo "latest=false" >> "$GITHUB_OUTPUT"
          elif [ "$newest" != "$TAG" ]; then
            echo "::notice::$TAG is not the newest release on main ($newest): not marked Latest."
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: client-tarball
          path: ${{ runner.temp }}/client
      - name: Create the release if need be, and attach the client
        env:
          LATEST: ${{ steps.release.outputs.latest }}
          DIR: ${{ runner.temp }}/client
        run: |
          name="fdv-client-${TAG#v}.tgz"
          asset="$DIR/$name"
          test -f "$asset" || { echo "::error::$name was not packed: is package.json's version the tag's?"; exit 1; }
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            pre=
            case "$TAG" in *-*) pre=--prerelease ;; esac
            notes="Family Document Vault ${TAG}: see [CHANGELOG.md](https://github.com/${GH_REPO}/blob/${TAG}/CHANGELOG.md) for what changed.

          Images: \`ghcr.io/${GH_REPO}/{api,worker,web}:${TAG#v}\`.

          The API client for apps (MIT), installable by this URL:
          \`https://github.com/${GH_REPO}/releases/download/${TAG}/${name}\`"
            gh release create "$TAG" "$asset" --verify-tag --title "$TAG" --notes "$notes" \
              --latest="$LATEST" $pre
            echo "Released $TAG with $name"
            exit 0
          fi
          # Apps pin the tarball's integrity hash: the bytes behind its URL
          # never change. The same bytes again (a re-run) are left as they
          # are; different bytes fail, for a new tag to carry them.
          if gh release view "$TAG" --json assets -q '.assets[].name' | grep -qxF "$name"; then
            mkdir -p "$RUNNER_TEMP/attached"
            gh release download "$TAG" --pattern "$name" --dir "$RUNNER_TEMP/attached"
            had=$(sha256sum "$RUNNER_TEMP/attached/$name" | cut -d' ' -f1)
            now=$(sha256sum "$asset" | cut -d' ' -f1)
            if [ "$had" = "$now" ]; then
              echo "$TAG already has $name, the same bytes ($now): nothing to do."
              exit 0
            fi
            echo "::error::$TAG already has a different $name (sha256 $had, this build $now). It is never replaced: tag a new version."
            exit 1
          fi
          gh release upload "$TAG" "$asset"
          echo "Attached $name to the existing release $TAG"

  # The worker draws people's photos and page previews with ImageMagick. The
  # job above has Ubuntu's ImageMagick 6 (Q16), which needs half the memory
  # per pixel and reads files differently; the worker image runs Alpine's
  # ImageMagick 7 (Q16-HDRI) with HEIC. What fails only there (5.17c: a 48
  # megapixel HEIC out of room; a WebP turned twice) is caught here, on the
  # worker image's own packages.
  image-tests:
    name: Image tests on the worker's ImageMagick 7
    runs-on: ubuntu-24.04
    needs: guard
    container: node:22-alpine@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a
    services:
      postgres:
        image: postgres:16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
        env:
          POSTGRES_USER: fdv
          POSTGRES_PASSWORD: fdv
          POSTGRES_DB: fdv
        options: >-
          --health-cmd "pg_isready -U fdv"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      # A service is reached by its name from a job in a container.
      DATABASE_ADMIN_URL: postgres://fdv:fdv@postgres:5432/fdv
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      # The worker image's tools, all here: the checks that need exactly them
      # (OCR reading a view-only page's watermark back, where a line in each
      # script falls) run here, and are skipped everywhere else.
      FDV_IMAGE_PARITY: '1'
    steps:
      # The worker image's packages (Dockerfile, worker stage) — pango and the
      # fonts a view-only link's pages are written in (5.18), pruned to one
      # weight each as the image keeps them — and what the tests make their
      # pictures with: libheif's encoders and heif-enc (the worker only reads
      # HEIC), and git, for the checkout.
      - name: Install the worker image's tools
        run: |
          apk add --no-cache git tesseract-ocr tesseract-ocr-data-eng tesseract-ocr-data-osd poppler-utils \
            imagemagick imagemagick-heic imagemagick-pango fontconfig font-dejavu \
            font-liberation font-noto font-noto-arabic font-noto-devanagari font-noto-emoji \
            font-wqy-zenhei postgresql16-client libheif-plugins-all libheif-tools
          find /usr/share/fonts/noto -type f ! -name NotoSans-Regular.ttf \
            ! -name NotoSansArabic-Regular.ttf ! -name NotoSansDevanagari-Regular.ttf \
            ! -name NotoColorEmoji.ttf -delete
          fc-cache -f
          magick -version | head -1
          magick -list format | grep PANGO
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: The worker's ImageMagick tests
        run: >-
          pnpm exec vitest run
          apps/worker/src/jobs/member-photo.test.ts
          apps/worker/src/jobs/previews.test.ts
          apps/worker/src/jobs/share-pages.test.ts
          apps/worker/src/jobs/incoming.test.ts
          apps/worker/src/jobs/tesseract-cap.test.ts

  images:
    name: Build images
    runs-on: ubuntu-24.04
    needs: check
    # The only job that pushes to GHCR, and the only one that may ask GitHub
    # for an OIDC token: cosign signs each pushed image with it (keyless, no
    # key to keep), and the signature names this workflow and this tag.
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        target: [api, worker, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # All history: whether a tag's commit is on main decides `latest`.
          fetch-depth: 0
      - name: Is this a release, on main?
        id: release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # `latest` is what a self-hoster gets by default, so it moves only
          # for a tag whose commit is on main (a milestone or a hotfix) and
          # has no pre-release part (5.2). Iteration tags on develop and
          # release candidates publish their own versions only.
          # It must also be the newest release on main, so re-running an
          # older tag's build never moves `latest` backwards. A release is
          # tagged on main's commit after the merge; tagged earlier, its
          # build says so and `latest` waits for a re-run.
          newest=$(git tag --merged origin/main --sort=-v:refname 'v*' | grep -v -- - | head -1)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "latest=false" >> "$GITHUB_OUTPUT"
          elif ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::notice::$GITHUB_REF_NAME is not on main: published as its own version only, latest unchanged."
            echo "latest=false" >> "$GITHUB_OUTPUT"
          elif [ "$newest" != "$GITHUB_REF_NAME" ]; then
            echo "::notice::$GITHUB_REF_NAME is not the newest release on main ($newest): latest unchanged."
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.target }}
          # The action adds `latest` by itself for any stable version tag
          # (flavor latest=auto): that, not the rule below, moved `latest`
          # to v0.5.1, a development build. Only the rule decides now.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ steps.release.outputs.latest == 'true' }}
      - name: Build (and push on tag)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # What went into each image, attached to what is pushed: the full
          # build provenance (SLSA) and a software bill of materials (SPDX).
          # A build that pushes nothing has nowhere to attach them.
          provenance: ${{ startsWith(github.ref, 'refs/tags/v') && 'mode=max' || 'false' }}
          sbom: ${{ startsWith(github.ref, 'refs/tags/v') }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      # Keyless: the certificate is issued to this workflow, on this tag, by
      # GitHub's OIDC token, and the signature is logged in Rekor. The README
      # says how a self-hoster checks it ("Verifying the images").
      - name: Sign the pushed image by its digest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TARGET: ${{ matrix.target }}
        run: |
          test -n "$DIGEST" || { echo "::error::the build gave no digest to sign"; exit 1; }
          image="ghcr.io/${GITHUB_REPOSITORY,,}/${TARGET}@${DIGEST}"
          cosign sign --yes "$image"
          echo "Signed $image"
      - name: The image's digest, in the job summary
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TARGET: ${{ matrix.target }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ${TARGET}"
            echo
            echo "\`ghcr.io/${GITHUB_REPOSITORY,,}/${TARGET}@${DIGEST}\`"
            echo
            echo "Tags: $(echo "$TAGS" | tr '\n' ' ')"
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: End to end (docker compose)
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start the stack exactly as a self-hoster would
        run: |
          node scripts/gen-env.mjs
          # Every spec runs from this one address, well over a family's pace:
          # the per-address ceiling is raised as a household on one address
          # would (the tighter sign-in and link limits stay as they are).
          echo "FDV_RATE_LIMIT_PER_MINUTE=3000" >> .env
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/readyz && break
            sleep 5
          done
          curl -sf http://localhost:8080/api/v1/capabilities
      - run: pnpm e2e
      # The backup is only as good as the vault it gives back: back up, run
      # the drill, lose the database, restore it as the README says, and
      # sign back in to find everything there.
      - name: Back up, lose the database, restore it as the README says
        run: sh scripts/ci-restore.sh
      - name: The same stack, behind TLS, the way another device reaches it
        run: |
          echo "FDV_HOSTNAME=vault.test" >> .env
          docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
          for i in $(seq 1 30); do
            docker compose -f docker-compose.yml -f docker-compose.tls.yml               cp caddy:/data/caddy/pki/authorities/local/root.crt ./vault-ca.crt 2>/dev/null && break
            sleep 2
          done
          # The README tells a self-hoster to export that CA and trust it;
          # this proves the path exists and the certificate it signs works.
          # The CA is written before the site's certificate is issued, so the
          # first handshakes can fail (curl 35); give it half a minute.
          ok=
          for i in $(seq 1 30); do
            curl -sf --cacert ./vault-ca.crt --resolve vault.test:443:127.0.0.1               https://vault.test/api/v1/capabilities > /dev/null && ok=1 && break
            sleep 1
          done
          test -n "$ok" || { echo "https://vault.test never answered with the vault CA's certificate"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' --resolve vault.test:80:127.0.0.1             http://vault.test/)
          test "$code" = "308" || { echo "expected a redirect to https, got $code"; exit 1; }
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -200
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-results
          path: test-results/
