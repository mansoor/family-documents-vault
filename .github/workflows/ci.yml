name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: Private folders are absent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if docs-private/ or prototype/ were ever committed
        run: |
          if git ls-files | grep -E '^(docs-private|prototype)/' ; then
            echo "::error::Private documentation was committed. Remove it and rewrite history."
            exit 1
          fi
          echo "OK: no private folders in the tree."

  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
