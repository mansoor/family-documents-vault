name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  guard:
    name: Private folders are absent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if docs-private/ or prototype/ were ever committed
        run: |
          if git ls-files | grep -E '^(docs-private|prototype)/' ; then
            echo "::error::Private documentation was committed. Remove it and rewrite history."
            exit 1
          fi
          echo "OK: no private folders in the tree."

  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    needs: guard
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fdv
          POSTGRES_PASSWORD: fdv
          POSTGRES_DB: fdv
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fdv"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_ADMIN_URL: postgres://fdv:fdv@localhost:5432/fdv
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  images:
    name: Build images
    runs-on: ubuntu-latest
    needs: check
    strategy:
      matrix:
        target: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build (and push on tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
