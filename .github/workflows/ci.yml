name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  guard:
    name: Private folders are absent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if docs-private/ or prototype/ were ever committed
        run: |
          if git ls-files | grep -E '^(docs-private|prototype)/' ; then
            echo "::error::Private documentation was committed. Remove it and rewrite history."
            exit 1
          fi
          echo "OK: no private folders in the tree."
      - name: Fail if phone-app files or signing keys were committed
        run: |
          if git ls-files | grep -E '(^|/)(android|ios|\.expo)/|\.(jks|keystore|p12|p8)$|(^|/)(google-services\.json|GoogleService-Info\.plist)$' ; then
            echo "::error::The phone app and its keys belong in the private repository."
            exit 1
          fi
          echo "OK: nothing from the phone app in the tree."

  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    needs: guard
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fdv
          POSTGRES_PASSWORD: fdv
          POSTGRES_DB: fdv
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fdv"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_ADMIN_URL: postgres://fdv:fdv@localhost:5432/fdv
      S3_TEST_ENDPOINT: http://localhost:9000
      S3_TEST_KEY: fdv
      S3_TEST_SECRET: fdv-minio-test
    steps:
      - uses: actions/checkout@v4
      # pg_dump and psql of the server's major version, as the worker image
      # pairs them: a newer pg_dump writes dumps PostgreSQL 16 cannot load.
      - name: Install OCR and rendering tools, and PostgreSQL 16's client (for the worker's tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr poppler-utils imagemagick postgresql-client-16
      - name: Start Mailpit (SMTP for the notification tests)
        run: |
          docker run -d --name mailpit -p 1025:1025 -p 8025:8025 axllent/mailpit:latest
          for i in $(seq 1 30); do
            curl -sf http://localhost:8025/api/v1/messages?limit=1 >/dev/null && break
            sleep 1
          done
      # MinIO no longer publishes its images (quay.io and Docker Hub both
      # refuse them, as of September 2026). VersityGW (Apache-2.0) speaks the
      # same S3 API over a plain directory, which is all these tests need.
      - name: Start an S3-compatible server (VersityGW) for the adapter tests
        run: |
          docker run -d --name s3 -p 9000:7070             -e ROOT_ACCESS_KEY=fdv -e ROOT_SECRET_KEY=fdv-minio-test             versity/versitygw:v1.8.0 posix /tmp
          for i in $(seq 1 30); do
            # Any answer will do: without credentials it is a 403.
            curl -s -o /dev/null http://localhost:9000/ && break
            sleep 1
          done
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: A release tag is the version in package.json
        # The server reports package.json's version (stamped in at build),
        # so a tag that disagrees would publish images that lie about
        # what they are.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but package.json says $want. Bump the version before tagging."
            exit 1
          fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  images:
    name: Build images
    runs-on: ubuntu-latest
    needs: check
    strategy:
      matrix:
        target: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build (and push on tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

  e2e:
    name: End to end (docker compose)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start the stack exactly as a self-hoster would
        run: |
          node scripts/gen-env.mjs
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/readyz && break
            sleep 5
          done
          curl -sf http://localhost:8080/api/v1/capabilities
      - run: pnpm e2e
      # The backup is only as good as the vault it gives back: back up, run
      # the drill, lose the database, restore it as the README says, and
      # sign back in to find everything there.
      - name: Back up, lose the database, restore it as the README says
        run: sh scripts/ci-restore.sh
      - name: The same stack, behind TLS, the way another device reaches it
        run: |
          echo "FDV_HOSTNAME=vault.test" >> .env
          docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
          for i in $(seq 1 30); do
            docker compose -f docker-compose.yml -f docker-compose.tls.yml               cp caddy:/data/caddy/pki/authorities/local/root.crt ./vault-ca.crt 2>/dev/null && break
            sleep 2
          done
          # The README tells a self-hoster to export that CA and trust it;
          # this proves the path exists and the certificate it signs works.
          curl -sf --cacert ./vault-ca.crt --resolve vault.test:443:127.0.0.1             https://vault.test/api/v1/capabilities > /dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' --resolve vault.test:80:127.0.0.1             http://vault.test/)
          test "$code" = "308" || { echo "expected a redirect to https, got $code"; exit 1; }
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
