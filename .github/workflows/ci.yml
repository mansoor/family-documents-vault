name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  guard:
    name: Private folders are absent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if docs-private/ or prototype/ were ever committed
        run: |
          if git ls-files | grep -E '^(docs-private|prototype)/' ; then
            echo "::error::Private documentation was committed. Remove it and rewrite history."
            exit 1
          fi
          echo "OK: no private folders in the tree."
      - name: Fail if phone-app files or signing keys were committed
        run: |
          if git ls-files | grep -E '(^|/)(android|ios|\.expo)/|\.(jks|keystore|p12|p8)$|(^|/)(google-services\.json|GoogleService-Info\.plist)$' ; then
            echo "::error::The phone app and its keys belong in the private repository."
            exit 1
          fi
          echo "OK: nothing from the phone app in the tree."

  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    needs: guard
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fdv
          POSTGRES_PASSWORD: fdv
          POSTGRES_DB: fdv
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fdv"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_ADMIN_URL: postgres://fdv:fdv@localhost:5432/fdv
      S3_TEST_ENDPOINT: http://localhost:9000
      S3_TEST_KEY: fdv
      S3_TEST_SECRET: fdv-minio-test
    steps:
      - uses: actions/checkout@v4
      # pg_dump and psql of the server's major version, as the worker image
      # pairs them: a newer pg_dump writes dumps PostgreSQL 16 cannot load.
      - name: Install OCR and rendering tools, and PostgreSQL 16's client (for the worker's tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr poppler-utils imagemagick postgresql-client-16
      - name: Start Mailpit (SMTP for the notification tests)
        run: |
          docker run -d --name mailpit -p 1025:1025 -p 8025:8025 axllent/mailpit:latest
          for i in $(seq 1 30); do
            curl -sf http://localhost:8025/api/v1/messages?limit=1 >/dev/null && break
            sleep 1
          done
      # MinIO no longer publishes its images (quay.io and Docker Hub both
      # refuse them, as of September 2026). VersityGW (Apache-2.0) speaks the
      # same S3 API over a plain directory, which is all these tests need.
      - name: Start an S3-compatible server (VersityGW) for the adapter tests
        run: |
          docker run -d --name s3 -p 9000:7070             -e ROOT_ACCESS_KEY=fdv -e ROOT_SECRET_KEY=fdv-minio-test             versity/versitygw:v1.8.0 posix /tmp
          for i in $(seq 1 30); do
            # Any answer will do: without credentials it is a 403.
            curl -s -o /dev/null http://localhost:9000/ && break
            sleep 1
          done
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: A release tag is the version in package.json
        # The server reports package.json's version (stamped in at build),
        # so a tag that disagrees would publish images that lie about
        # what they are.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but package.json says $want. Bump the version before tagging."
            exit 1
          fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # A phone already in someone's pocket carries the client of one vault
      # release; a server change that would break it fails here (5.2).
      - name: The client an older phone carries still works (app 0.2.0)
        run: pnpm test:older-client
      # App 0.2.1 carries the client of v0.5.11: its type scenarios hold
      # expiry_driver and reminder_leads to what it reads (5.16a).
      - name: The client an older phone carries still works (app 0.2.1)
        run: pnpm test:older-client
        env:
          OLDER_CLIENT_REF: v0.5.11
      - run: pnpm build

  # The worker draws people's photos and page previews with ImageMagick. The
  # job above has Ubuntu's ImageMagick 6 (Q16), which needs half the memory
  # per pixel and reads files differently; the worker image runs Alpine's
  # ImageMagick 7 (Q16-HDRI) with HEIC. What fails only there (5.17c: a 48
  # megapixel HEIC out of room; a WebP turned twice) is caught here, on the
  # worker image's own packages.
  image-tests:
    name: Image tests on the worker's ImageMagick 7
    runs-on: ubuntu-latest
    needs: guard
    container: node:22-alpine
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fdv
          POSTGRES_PASSWORD: fdv
          POSTGRES_DB: fdv
        options: >-
          --health-cmd "pg_isready -U fdv"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      # A service is reached by its name from a job in a container.
      DATABASE_ADMIN_URL: postgres://fdv:fdv@postgres:5432/fdv
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      # The worker image's tools, all here: the checks that need exactly them
      # (OCR reading a view-only page's watermark back, where a line in each
      # script falls) run here, and are skipped everywhere else.
      FDV_IMAGE_PARITY: '1'
    steps:
      # The worker image's packages (Dockerfile, worker stage) — pango and the
      # fonts a view-only link's pages are written in (5.18), pruned to one
      # weight each as the image keeps them — and what the tests make their
      # pictures with: libheif's encoders and heif-enc (the worker only reads
      # HEIC), and git, for the checkout.
      - name: Install the worker image's tools
        run: |
          apk add --no-cache git tesseract-ocr tesseract-ocr-data-eng poppler-utils \
            imagemagick imagemagick-heic imagemagick-pango fontconfig font-dejavu \
            font-liberation font-noto font-noto-arabic font-noto-devanagari font-noto-emoji \
            font-wqy-zenhei postgresql16-client libheif-plugins-all libheif-tools
          find /usr/share/fonts/noto -type f ! -name NotoSans-Regular.ttf \
            ! -name NotoSansArabic-Regular.ttf ! -name NotoSansDevanagari-Regular.ttf \
            ! -name NotoColorEmoji.ttf -delete
          fc-cache -f
          magick -version | head -1
          magick -list format | grep PANGO
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: The worker's ImageMagick tests
        run: >-
          pnpm exec vitest run
          apps/worker/src/jobs/member-photo.test.ts
          apps/worker/src/jobs/previews.test.ts
          apps/worker/src/jobs/share-pages.test.ts

  images:
    name: Build images
    runs-on: ubuntu-latest
    needs: check
    strategy:
      matrix:
        target: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
        with:
          # All history: whether a tag's commit is on main decides `latest`.
          fetch-depth: 0
      - name: Is this a release, on main?
        id: release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # `latest` is what a self-hoster gets by default, so it moves only
          # for a tag whose commit is on main (a milestone or a hotfix) and
          # has no pre-release part (5.2). Iteration tags on develop and
          # release candidates publish their own versions only.
          # It must also be the newest release on main, so re-running an
          # older tag's build never moves `latest` backwards. A release is
          # tagged on main's commit after the merge; tagged earlier, its
          # build says so and `latest` waits for a re-run.
          newest=$(git tag --merged origin/main --sort=-v:refname 'v*' | grep -v -- - | head -1)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "latest=false" >> "$GITHUB_OUTPUT"
          elif ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::notice::$GITHUB_REF_NAME is not on main: published as its own version only, latest unchanged."
            echo "latest=false" >> "$GITHUB_OUTPUT"
          elif [ "$newest" != "$GITHUB_REF_NAME" ]; then
            echo "::notice::$GITHUB_REF_NAME is not the newest release on main ($newest): latest unchanged."
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.target }}
          # The action adds `latest` by itself for any stable version tag
          # (flavor latest=auto): that, not the rule below, moved `latest`
          # to v0.5.1, a development build. Only the rule decides now.
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ steps.release.outputs.latest == 'true' }}
      - name: Build (and push on tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

  e2e:
    name: End to end (docker compose)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start the stack exactly as a self-hoster would
        run: |
          node scripts/gen-env.mjs
          # Every spec runs from this one address, well over a family's pace:
          # the per-address ceiling is raised as a household on one address
          # would (the tighter sign-in and link limits stay as they are).
          echo "FDV_RATE_LIMIT_PER_MINUTE=3000" >> .env
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/readyz && break
            sleep 5
          done
          curl -sf http://localhost:8080/api/v1/capabilities
      - run: pnpm e2e
      # The backup is only as good as the vault it gives back: back up, run
      # the drill, lose the database, restore it as the README says, and
      # sign back in to find everything there.
      - name: Back up, lose the database, restore it as the README says
        run: sh scripts/ci-restore.sh
      - name: The same stack, behind TLS, the way another device reaches it
        run: |
          echo "FDV_HOSTNAME=vault.test" >> .env
          docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
          for i in $(seq 1 30); do
            docker compose -f docker-compose.yml -f docker-compose.tls.yml               cp caddy:/data/caddy/pki/authorities/local/root.crt ./vault-ca.crt 2>/dev/null && break
            sleep 2
          done
          # The README tells a self-hoster to export that CA and trust it;
          # this proves the path exists and the certificate it signs works.
          # The CA is written before the site's certificate is issued, so the
          # first handshakes can fail (curl 35); give it half a minute.
          ok=
          for i in $(seq 1 30); do
            curl -sf --cacert ./vault-ca.crt --resolve vault.test:443:127.0.0.1               https://vault.test/api/v1/capabilities > /dev/null && ok=1 && break
            sleep 1
          done
          test -n "$ok" || { echo "https://vault.test never answered with the vault CA's certificate"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' --resolve vault.test:80:127.0.0.1             http://vault.test/)
          test "$code" = "308" || { echo "expected a redirect to https, got $code"; exit 1; }
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
