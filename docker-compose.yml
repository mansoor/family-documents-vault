# Family Document Vault — production shape.
#
#   node scripts/gen-env.mjs     # once: writes .env
#   docker compose up -d
#   open http://localhost:8080
#
# Four containers, and a fifth, `migrate`, that runs once each time the
# stack starts and exits. Data lives in two named volumes: `db-data`
# (metadata) and `vault-data` (encrypted files, when the local vault is
# used). Back up both, plus your .env — the master key in it is what makes
# the files readable.
#
# Every container is hardened (README, "Hardened containers"): no Linux
# capabilities it does not need, nothing gained through setuid programs, a
# read-only root filesystem with only the folders it writes to writable, and
# a ceiling on processes and memory. The ceilings are generous; raise one in
# .env (FDV_WORKER_MEM_LIMIT=4g, say) if a container is ever stopped for
# memory. CPU is not capped unless you set FDV_<SERVICE>_CPUS.
#
# Images are pinned by digest as well as tag, so a tag moved upstream changes
# nothing here until this file does (Dependabot proposes the moves).

name: fdv

services:
  postgres:
    image: postgres:16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
    restart: unless-stopped
    # Its entrypoint starts as root, sets the data folder's owner and drops
    # to the postgres user: capabilities stay as Docker gives them, but no
    # program it runs may gain more.
    security_opt: ['no-new-privileges:true']
    environment:
      POSTGRES_USER: fdv
      POSTGRES_PASSWORD: ${FDV_DB_PASSWORD:?run scripts/gen-env.mjs first}
      POSTGRES_DB: fdv
      FDV_DB_APP_PASSWORD: ${FDV_DB_APP_PASSWORD:?run scripts/gen-env.mjs first}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      # Over TCP, as everything else connects: on a new volume the image
      # first runs a setup server on the socket alone, which is not ready.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U fdv -d fdv']
      interval: 5s
      timeout: 3s
      retries: 12

  # Runs once, each time the stack starts, and exits: applies the database
  # migrations and the job queue's schema as the role that owns the tables,
  # and checks the master key opens the vault. The api and the worker start
  # only once it has finished without error (`docker compose logs migrate`
  # says why if not). It alone holds the owning role's password for that
  # moment; the API that stays up never does. The api image, so it is
  # pulled and built with it. The master-key commands run here too (README,
  # "Rotating the master key").
  migrate:
    image: ghcr.io/mansoor/family-documents-vault/api:${FDV_VERSION:-latest}
    build:
      context: .
      target: api
    command: ['node', 'apps/api/dist/cli.mjs', 'migrate']
    restart: 'no'
    environment:
      DATABASE_URL: postgres://fdv_app:${FDV_DB_APP_PASSWORD}@postgres:5432/fdv
      DATABASE_ADMIN_URL: postgres://fdv:${FDV_DB_PASSWORD}@postgres:5432/fdv
      FDV_MASTER_KEY: ${FDV_MASTER_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # The image's health check is the API's, which a one-shot never answers.
    healthcheck:
      disable: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs:
      - /tmp:size=16m
    pids_limit: 128
    mem_limit: ${FDV_MIGRATE_MEM_LIMIT:-512m}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ghcr.io/mansoor/family-documents-vault/api:${FDV_VERSION:-latest}
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      # The application role alone, which row-level security holds to each
      # household: the migrate service above has done what needs the owning
      # role, so DATABASE_ADMIN_URL is not given here.
      DATABASE_URL: postgres://fdv_app:${FDV_DB_APP_PASSWORD}@postgres:5432/fdv
      # Or FDV_MASTER_KEY_FILE, a Docker secret (docker-compose.secrets.yml).
      FDV_MASTER_KEY: ${FDV_MASTER_KEY:-}
      FDV_DISPLAY_NAME: ${FDV_DISPLAY_NAME:-Our family vault}
      # The family's time zone until an owner chooses one in Settings (an
      # IANA name; UTC unless set). The worker has the same.
      FDV_TIMEZONE: ${FDV_TIMEZONE:-}
      FDV_VAPID_PUBLIC_KEY: ${FDV_VAPID_PUBLIC_KEY:-}
      FDV_PUSH_ALLOW_PRIVATE_ENDPOINTS: ${FDV_PUSH_ALLOW_PRIVATE_ENDPOINTS:-false}
      # Where the vault is published. The API needs it for the same reason
      # the worker does — links it puts in email — and for one thing only it
      # does: checking the origin a passkey was signed for.
      FDV_BASE_URL: ${FDV_BASE_URL:-http://localhost:8080}
      # The public-only site, when you run one (README): share links start with it.
      FDV_PUBLIC_URL: ${FDV_PUBLIC_URL:-}
      # Where the uploader app for computers is downloaded from (0.8.0); optional.
      FDV_DESKTOP_DOWNLOAD_URL: ${FDV_DESKTOP_DOWNLOAD_URL:-}
      # The most one paired computer may send in a day, in bytes (2 GB unless set).
      FDV_DEVICE_DAILY_BYTES: ${FDV_DEVICE_DAILY_BYTES:-}
      # Connected apps (0.9.0): on serves their routes on the public-only site
      # too (give caddy-public the same); the ceilings of an app's day.
      FDV_PUBLIC_APPS: ${FDV_PUBLIC_APPS:-off}
      # Development only: plain http for connected apps to a localhost vault.
      FDV_APPS_LOCAL_HTTP: ${FDV_APPS_LOCAL_HTTP:-off}
      FDV_APP_DAILY_FILES: ${FDV_APP_DAILY_FILES:-}
      FDV_APP_DAILY_BYTES: ${FDV_APP_DAILY_BYTES:-}
      # The longest a share link may last, in days (90 at most).
      FDV_SHARE_MAX_DAYS: ${FDV_SHARE_MAX_DAYS:-}
      FDV_SMTP_URL: ${FDV_SMTP_URL:-}
      FDV_RP_ID: ${FDV_RP_ID:-}
      # The code first-run setup asks for (0.9.0): gen-env writes it. Unset,
      # the API makes one as it starts, until set up, and logs it.
      FDV_SETUP_TOKEN: ${FDV_SETUP_TOKEN:-}
      # Whose X-Forwarded-For to believe (5.30): the networks the API's own
      # container is on — nginx and Caddy — and nothing on your LAN.
      FDV_TRUST_PROXY: ${FDV_TRUST_PROXY:-network}
      FDV_MAX_UPLOAD_BYTES: ${FDV_MAX_UPLOAD_BYTES:-}
      FDV_OFFLINE_MAX_DAYS: ${FDV_OFFLINE_MAX_DAYS:-}
      # The worker's, given to the API too (0.9.0, H5): a sensitive document's
      # delete confirmation says older backups hold it this many days.
      FDV_BACKUP_RETAIN_DAYS: ${FDV_BACKUP_RETAIN_DAYS:-30}
      # Days without an off-site copy before the owners are told (2: nightly backups).
      FDV_BACKUP_OFFSITE_LATE_DAYS: ${FDV_BACKUP_OFFSITE_LATE_DAYS:-2}
      # Days without a backup before Security & health says so (2: nightly backups).
      FDV_BACKUP_LATE_DAYS: ${FDV_BACKUP_LATE_DAYS:-2}
      FDV_RATE_LIMIT_PER_MINUTE: ${FDV_RATE_LIMIT_PER_MINUTE:-}
      # Whether owners may set the AI reader in Settings → Reading (on unless
      # off), and the ports it may be on. The worker has the same.
      FDV_AI_READER_SETTINGS: ${FDV_AI_READER_SETTINGS:-}
      FDV_AI_READER_ALLOWED_PORTS: ${FDV_AI_READER_ALLOWED_PORTS:-}
      FDV_SMS_GATE_ALLOWED_PORTS: ${FDV_SMS_GATE_ALLOWED_PORTS:-}
      # self_hosted unless set; the worker must have the same (README).
      FDV_EDITION: ${FDV_EDITION:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - vault-data:/data
    # It writes only to /data (the vault's files) and a small /tmp in memory.
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs:
      - /tmp:size=64m
    pids_limit: ${FDV_API_PIDS_LIMIT:-256}
    mem_limit: ${FDV_API_MEM_LIMIT:-1g}
    # 0: not capped. A number of CPUs (1.5, say) caps it; more than the
    # machine has is refused by Docker.
    cpus: ${FDV_API_CPUS:-0}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    image: ghcr.io/mansoor/family-documents-vault/worker:${FDV_VERSION:-latest}
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://fdv_app:${FDV_DB_APP_PASSWORD}@postgres:5432/fdv
      # The worker keeps the owning role, unlike the API: the nightly backup
      # (pg_dump) must read every household's rows, which row-level security
      # hides from the application role, and a restore recreates the tables.
      DATABASE_ADMIN_URL: postgres://fdv:${FDV_DB_PASSWORD}@postgres:5432/fdv
      # Or FDV_MASTER_KEY_FILE, a Docker secret (docker-compose.secrets.yml).
      FDV_MASTER_KEY: ${FDV_MASTER_KEY:-}
      FDV_BASE_URL: ${FDV_BASE_URL:-http://localhost:8080}
      FDV_SMTP_URL: ${FDV_SMTP_URL:-}
      FDV_SMTP_FROM: ${FDV_SMTP_FROM:-Family Document Vault <vault@localhost>}
      FDV_VAPID_PUBLIC_KEY: ${FDV_VAPID_PUBLIC_KEY:-}
      FDV_VAPID_PRIVATE_KEY: ${FDV_VAPID_PRIVATE_KEY:-}
      FDV_VAPID_SUBJECT: ${FDV_VAPID_SUBJECT:-mailto:vault@example.invalid}
      FDV_PUSH_ALLOW_PRIVATE_ENDPOINTS: ${FDV_PUSH_ALLOW_PRIVATE_ENDPOINTS:-false}
      FDV_WEEKLY_HOUR: ${FDV_WEEKLY_HOUR:-18}
      FDV_OCR_MAX_PAGES: ${FDV_OCR_MAX_PAGES:-20}
      FDV_BACKUP_CRON: ${FDV_BACKUP_CRON:-30 2 * * *}
      FDV_DIGEST_HOUR: ${FDV_DIGEST_HOUR:-9}
      # The family's time zone until an owner chooses one: the hour above is on it.
      FDV_TIMEZONE: ${FDV_TIMEZONE:-}
      FDV_BACKUP_RETAIN_DAYS: ${FDV_BACKUP_RETAIN_DAYS:-30}
      # Days without an off-site copy before the owners are told (2: nightly backups).
      FDV_BACKUP_OFFSITE_LATE_DAYS: ${FDV_BACKUP_OFFSITE_LATE_DAYS:-2}
      # Days without a backup before Security & health says so (2: nightly backups).
      FDV_BACKUP_LATE_DAYS: ${FDV_BACKUP_LATE_DAYS:-2}
      # The scanner folder (README, "Scanning straight into the vault"): set
      # FDV_WATCH_DIR=/watch in .env and uncomment the mount below. The
      # largest file it takes is the same as for an upload.
      FDV_WATCH_DIR: ${FDV_WATCH_DIR:-}
      # The folders an owner may choose the scanner folder inside, in Settings.
      FDV_WATCH_ROOTS: ${FDV_WATCH_ROOTS:-}
      FDV_WATCH_STABLE_SECONDS: ${FDV_WATCH_STABLE_SECONDS:-}
      FDV_WATCH_INCOMPLETE_GRACE_SECONDS: ${FDV_WATCH_INCOMPLETE_GRACE_SECONDS:-}
      FDV_MAX_UPLOAD_BYTES: ${FDV_MAX_UPLOAD_BYTES:-}
      # Email in (README, "Emailing documents to the vault"): the household
      # mailbox, checked over IMAP. The worker's alone: never give these to
      # the API or the web.
      FDV_MAIL_IN_HOST: ${FDV_MAIL_IN_HOST:-}
      FDV_MAIL_IN_PORT: ${FDV_MAIL_IN_PORT:-}
      FDV_MAIL_IN_USER: ${FDV_MAIL_IN_USER:-}
      FDV_MAIL_IN_PASSWORD: ${FDV_MAIL_IN_PASSWORD:-}
      FDV_MAIL_IN_PASSWORD_FILE: ${FDV_MAIL_IN_PASSWORD_FILE:-}
      FDV_MAIL_IN_ADDRESS: ${FDV_MAIL_IN_ADDRESS:-}
      FDV_MAIL_IN_FOLDER: ${FDV_MAIL_IN_FOLDER:-}
      FDV_MAIL_IN_POLL_SECONDS: ${FDV_MAIL_IN_POLL_SECONDS:-}
      FDV_MAIL_IN_AFTER: ${FDV_MAIL_IN_AFTER:-}
      FDV_MAIL_IN_AUTHSERV_ID: ${FDV_MAIL_IN_AUTHSERV_ID:-}
      # Where a mailbox an owner sets up in Settings may be: 993, outside
      # your own network, unless these allow more.
      FDV_MAIL_IN_ALLOWED_PORTS: ${FDV_MAIL_IN_ALLOWED_PORTS:-}
      FDV_MAIL_IN_ALLOW_PRIVATE: ${FDV_MAIL_IN_ALLOW_PRIVATE:-}
      # The local AI reader (README, "A local AI reader"): an Ollama-compatible
      # model on this server or your own network — the `ollama` service below,
      # say, as http://ollama:11434. The worker's alone: never give it to the
      # API or the web. Unset, there is none; each household's owners turn it on.
      FDV_LOCAL_AI_URL: ${FDV_LOCAL_AI_URL:-}
      FDV_LOCAL_AI_MODEL: ${FDV_LOCAL_AI_MODEL:-}
      FDV_LOCAL_AI_TIMEOUT_SECONDS: ${FDV_LOCAL_AI_TIMEOUT_SECONDS:-}
      # Or an owner sets the reader in Settings → Reading → AI reader, unless
      # this is off; the two above win where they are set. The ports such a
      # reader may be on, and the edition, as the API has them.
      FDV_AI_READER_SETTINGS: ${FDV_AI_READER_SETTINGS:-}
      FDV_AI_READER_ALLOWED_PORTS: ${FDV_AI_READER_ALLOWED_PORTS:-}
      FDV_SMS_GATE_ALLOWED_PORTS: ${FDV_SMS_GATE_ALLOWED_PORTS:-}
      FDV_EDITION: ${FDV_EDITION:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Where ImageMagick keeps a large picture's pixels while it works, when
      # a call does not name a folder of its own: /tmp below, where the
      # worker's start sweeps what a stopped run left (temp-sweep.ts).
      MAGICK_TEMPORARY_PATH: /tmp
    volumes:
      - vault-data:/data
      # Its scratch folder: the plain pages and text of a document being
      # read, drawn or OCRed, and an export being built, which can be as
      # large as the whole vault — on disk, as before, not in memory. Its
      # own volume, as the root filesystem is read-only; the worker empties
      # it of anything a stopped job left as it starts.
      - worker-tmp:/tmp
      # - ./scanner:/watch
    # Tesseract, poppler and ImageMagick read what families upload here: no
    # capabilities, no setuid, nothing writable but /data and /tmp, and
    # ceilings on processes and memory (each tool run is capped as well).
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    pids_limit: ${FDV_WORKER_PIDS_LIMIT:-512}
    mem_limit: ${FDV_WORKER_MEM_LIMIT:-3g}
    cpus: ${FDV_WORKER_CPUS:-0}
    # Its own network as everything's, and the local AI's (R4): only the
    # worker reaches the `ollama` service below.
    networks:
      - default
      - local-ai
    depends_on:
      # Its queue's schema and every table it reads are the migrate service's.
      migrate:
        condition: service_completed_successfully

  web:
    image: ghcr.io/mansoor/family-documents-vault/web:${FDV_VERSION:-latest}
    build:
      context: .
      target: web
    restart: unless-stopped
    # Open to the network, as phones and laptops in the house reach the vault
    # at this machine's address on it; the TLS overlay keeps it to this
    # machine (docker-compose.tls.yml). Unset, FDV_BIND publishes it on every
    # interface, IPv4 and IPv6, as before it existed; FDV_BIND=127.0.0.1 keeps it to this
    # machine without the overlay: a VPS, or a reverse proxy of your own on
    # it (Docker's published ports go round ufw and firewalld; README,
    # "Security checklist"). nginx runs as its own unprivileged user, so it
    # listens on 8080 inside the container.
    ports:
      - '${FDV_BIND:+${FDV_BIND}:}${FDV_PORT:-8080}:8080'
    # nginx writes its pid and its buffers to /tmp alone.
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs:
      - /tmp:size=64m
    pids_limit: ${FDV_WEB_PIDS_LIMIT:-256}
    mem_limit: ${FDV_WEB_MEM_LIMIT:-256m}
    cpus: ${FDV_WEB_CPUS:-0}
    depends_on:
      api:
        condition: service_healthy

  # The local AI reader (0.9.0, R4; README, "A local AI reader"): optional,
  # and never started unless asked for —
  #   docker compose --profile local-ai up -d
  #   docker compose exec ollama ollama pull qwen2.5:3b-instruct
  # with FDV_LOCAL_AI_URL=http://ollama:11434 and FDV_LOCAL_AI_MODEL in .env.
  # No port is published, and it is on the `local-ai` network alone, which
  # only the worker shares: the API, the web and the database never reach
  # it, nor it them. Its models are kept in a volume of their own, never in
  # the vault's images.
  ollama:
    image: ollama/ollama:0.40.2@sha256:b86366bb528bbf7f1424435d165028497a5b69bf6ddb4fa5a87102e2b79f44fb
    profiles: [local-ai]
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    networks:
      - local-ai
    volumes:
      - ollama-models:/root/.ollama

networks:
  # The worker and the local AI alone (R4). Not internal: `ollama pull`
  # fetches models through it.
  local-ai:

volumes:
  db-data:
  vault-data:
  # The worker's scratch folder: nothing to back up.
  worker-tmp:
  ollama-models:
