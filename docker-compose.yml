# Family Document Vault — production shape.
#
#   node scripts/gen-env.mjs     # once: writes .env
#   docker compose up -d
#   open http://localhost:8080
#
# Four containers. Data lives in two named volumes: `db-data` (metadata) and
# `vault-data` (encrypted files, when the local vault is used). Back up both,
# plus your .env — the master key in it is what makes the files readable.

name: fdv

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fdv
      POSTGRES_PASSWORD: ${FDV_DB_PASSWORD:?run scripts/gen-env.mjs first}
      POSTGRES_DB: fdv
      FDV_DB_APP_PASSWORD: ${FDV_DB_APP_PASSWORD:?run scripts/gen-env.mjs first}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      # Over TCP, as everything else connects: on a new volume the image
      # first runs a setup server on the socket alone, which is not ready.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U fdv -d fdv']
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    image: ghcr.io/mansoor/family-documents-vault/api:${FDV_VERSION:-latest}
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://fdv_app:${FDV_DB_APP_PASSWORD}@postgres:5432/fdv
      DATABASE_ADMIN_URL: postgres://fdv:${FDV_DB_PASSWORD}@postgres:5432/fdv
      FDV_MASTER_KEY: ${FDV_MASTER_KEY:?run scripts/gen-env.mjs first}
      FDV_DISPLAY_NAME: ${FDV_DISPLAY_NAME:-Our family vault}
      FDV_VAPID_PUBLIC_KEY: ${FDV_VAPID_PUBLIC_KEY:-}
      FDV_PUSH_ALLOW_PRIVATE_ENDPOINTS: ${FDV_PUSH_ALLOW_PRIVATE_ENDPOINTS:-false}
      # Where the vault is published. The API needs it for the same reason
      # the worker does — links it puts in email — and for two things only
      # it does: checking the origin a passkey was signed for, and deciding
      # whose X-Forwarded-For to believe.
      FDV_BASE_URL: ${FDV_BASE_URL:-http://localhost:8080}
      FDV_SMTP_URL: ${FDV_SMTP_URL:-}
      FDV_RP_ID: ${FDV_RP_ID:-}
      FDV_TRUST_PROXY: ${FDV_TRUST_PROXY:-private}
      FDV_MAX_UPLOAD_BYTES: ${FDV_MAX_UPLOAD_BYTES:-}
      FDV_OFFLINE_MAX_DAYS: ${FDV_OFFLINE_MAX_DAYS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - vault-data:/data
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: ghcr.io/mansoor/family-documents-vault/worker:${FDV_VERSION:-latest}
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://fdv_app:${FDV_DB_APP_PASSWORD}@postgres:5432/fdv
      DATABASE_ADMIN_URL: postgres://fdv:${FDV_DB_PASSWORD}@postgres:5432/fdv
      FDV_MASTER_KEY: ${FDV_MASTER_KEY}
      FDV_BASE_URL: ${FDV_BASE_URL:-http://localhost:8080}
      FDV_SMTP_URL: ${FDV_SMTP_URL:-}
      FDV_SMTP_FROM: ${FDV_SMTP_FROM:-Family Document Vault <vault@localhost>}
      FDV_VAPID_PUBLIC_KEY: ${FDV_VAPID_PUBLIC_KEY:-}
      FDV_VAPID_PRIVATE_KEY: ${FDV_VAPID_PRIVATE_KEY:-}
      FDV_VAPID_SUBJECT: ${FDV_VAPID_SUBJECT:-mailto:vault@example.invalid}
      FDV_PUSH_ALLOW_PRIVATE_ENDPOINTS: ${FDV_PUSH_ALLOW_PRIVATE_ENDPOINTS:-false}
      FDV_WEEKLY_HOUR: ${FDV_WEEKLY_HOUR:-18}
      FDV_OCR_MAX_PAGES: ${FDV_OCR_MAX_PAGES:-20}
      FDV_BACKUP_CRON: ${FDV_BACKUP_CRON:-30 2 * * *}
      FDV_DIGEST_HOUR: ${FDV_DIGEST_HOUR:-9}
      FDV_BACKUP_RETAIN_DAYS: ${FDV_BACKUP_RETAIN_DAYS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - vault-data:/data
    depends_on:
      # The API runs migrations; the worker's queue schema depends on them.
      api:
        condition: service_healthy

  web:
    image: ghcr.io/mansoor/family-documents-vault/web:${FDV_VERSION:-latest}
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - '${FDV_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  vault-data:
