<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Light or dark before anything is drawn (0.9.0): the choice this browser
      // keeps, or the system's for Auto. theme.ts keeps it after; theme.test.ts
      // holds the two to the same answer; docker/nginx.conf allows this script
      // by its hash, so any change here changes the hash there.
      (function () {
        var t = null;
        try {
          t = window.localStorage.getItem('fdv.theme');
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          try {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          } catch (e) {
            t = 'light';
          }
        }
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t;
      })();
    </script>
    <meta name="theme-color" content="#1F5D4C" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Family Document Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
