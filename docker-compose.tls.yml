# HTTPS in front of the vault. Use together with the main file:
#
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# Browsers treat http://localhost as secure, so everything works on the
# machine the vault runs on. They do not extend that to http://192.168.x.x,
# and three things a family actually wants depend on it: passkeys, the
# day's reminders arriving on a phone, and installing the app to a home
# screen. This file is how the other devices in the house get a real
# https:// origin.
#
# Pick one of the two Caddyfiles with FDV_CADDYFILE (see README):
#   docker/caddy/Caddyfile.internal — a certificate Caddy issues itself
#   docker/caddy/Caddyfile.public   — Let's Encrypt, for a public name
#
# Remember to set FDV_BASE_URL to the https:// address as well: it is what
# reminder emails and notifications link back to.
#
# The public-only site (docker/caddy/Caddyfile.public-only) is a second
# address that serves only the pages a share link opens, for people outside
# the family, while everything else stays on the address above. It starts
# only with its profile:
#
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml --profile public-only up -d

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '${FDV_HTTPS_PORT:-443}:443'
      - '${FDV_HTTP_PORT:-80}:80'
    environment:
      FDV_HOSTNAME: ${FDV_HOSTNAME:-vault.local}
      FDV_TLS_EMAIL: ${FDV_TLS_EMAIL:-}
    volumes:
      - ${FDV_CADDYFILE:-./docker/caddy/Caddyfile.internal}:/etc/caddy/Caddyfile:ro
      # Certificates and the local CA live here. Keep this volume: losing
      # it means every device has to trust a new CA.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

  # The public-only site (5.16): share-link pages and their API, nothing
  # else. Its own ports, so it runs beside the site above: forward the
  # router's 443 and 80 to them. See the README.
  caddy-public:
    image: caddy:2-alpine
    profiles: [public-only]
    restart: unless-stopped
    ports:
      - '${FDV_PUBLIC_HTTPS_PORT:-8443}:443'
      - '${FDV_PUBLIC_HTTP_PORT:-8081}:80'
    environment:
      FDV_PUBLIC_HOSTNAME: ${FDV_PUBLIC_HOSTNAME:-}
      FDV_TLS_EMAIL: ${FDV_TLS_EMAIL:-}
    volumes:
      - ./docker/caddy/Caddyfile.public-only:/etc/caddy/Caddyfile:ro
      - caddy-public-data:/data
      - caddy-public-config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
  caddy-public-data:
  caddy-public-config:
