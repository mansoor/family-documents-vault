# What the access log may say about a request (0.5.0): a share link's, a
# password reset's and an invitation's token are each the whole secret, so
# they are cut; no query string is kept (a share's PIN travels on one, and a
# search's words); no referrer either, which can be a share page's address.
# As the API's own log does (apps/api/src/log-redaction.ts): a ZIP's
# download ticket (0.9.0, DL), a connected app's external id (APP1) and a
# connected app's link (APP3, all but its session's own name) too. No user
# is named: a connected app's Basic header (APP6) would make its client ID
# one, and the Authorization header is never logged.
map $request_uri $fdv_log_path {
    "~^(?<fdv_path>[^?]*)" $fdv_path;
}
map $request_uri $fdv_log_query {
    "~\?" "?[redacted]";
    default "";
}
map $fdv_log_path $fdv_log_uri {
    "~^(?<fdv_pre>/api/v1/(?:shared|password-resets|invitations|drop|downloads|apps/intake)/)[^/]+(?<fdv_rest>.*)$" "${fdv_pre}[redacted]${fdv_rest}";
    "~^(?<fdv_pre3>/api/v1/app-links/)(?!session(?:/|$))[^/]+(?<fdv_rest3>.*)$" "${fdv_pre3}[redacted]${fdv_rest3}";
    "~^(?<fdv_pre2>/(?:shared|reset|join|drop)/)[^/]+(?<fdv_rest2>.*)$" "${fdv_pre2}[redacted]${fdv_rest2}";
    default $fdv_log_path;
}
log_format fdv_redacted '$remote_addr - - [$time_local] '
                        '"$request_method $fdv_log_uri$fdv_log_query $server_protocol" '
                        '$status $body_bytes_sent "-" "$http_user_agent" "$http_x_forwarded_for"';

server {
    # nginx runs as its own unprivileged user (the image is
    # nginx-unprivileged). The compose file maps FDV_PORT to 8080, and Caddy
    # proxies to it. 80 is kept as well, for a docker-compose.yml or Caddyfile
    # from before 0.9.0-dev.74 still pointing there: Docker (20.10 and later)
    # lets a container's own user listen on any port in its own network, no
    # capability needed.
    listen 8080;
    listen 80;
    # A redirect nginx makes names no port: 8080 is this container's, not
    # the one the family reaches.
    absolute_redirect off;
    access_log /var/log/nginx/access.log fdv_redacted;
    # nginx's error lines repeat the raw request, secret and all ("connect()
    # failed ... request: GET /api/v1/shared/<token>..."), and their format
    # cannot be changed. Only critical ones are kept: the API being away
    # still shows, as a 502 or 504 in the access log above.
    error_log /var/log/nginx/error.log crit;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A path whose raw form hides a slash, a backslash or a dot (%2f, %5c,
    # %2e), or holds a segment starting with a dot, is answered 404 before
    # any location: the public-only site in front of the pages matches the
    # path cleaned and passes the raw one on, which nginx decodes and
    # normalises itself (/shared/%2e%2e/api/... is /api/... here). The path
    # alone is read ($fdv_log_path): a query may hold anything.
    if ($fdv_log_path ~* "(%2f|%5c|%2e|/\.)") {
        return 404;
    }

    # Uploads can be large; the API enforces its own limit.
    client_max_body_size 512m;
    proxy_request_buffering off;
    # A download larger than nginx's buffers is passed on as the browser
    # takes it, never spooled to a file: the container's only writable
    # folder is a small /tmp in memory.
    proxy_max_temp_file_size 0;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Who is asking (5.30): the address this connection came from, and
    # nothing the caller wrote. Anybody on the home network reaches :8080,
    # and what they put in X-Forwarded-For used to be added to and passed
    # on, as if a proxy had said it. Under the TLS overlay Caddy sends the
    # API's requests to the API itself (docker/caddy), with the address it
    # was reached from; here it is only ever the caller's own.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    # Every method passes: a connected app's link (0.9.0-dev.68) is a page
    # at /api/v1/app-links/<token> (GET) that opens it with a POST to the
    # same address.
    location /api/ {
        proxy_pass http://api:3000;
    }

    location = /healthz {
        proxy_pass http://api:3000;
    }

    location = /readyz {
        proxy_pass http://api:3000;
    }

    # The pages people outside the family open (5.16): a share link's (/s),
    # an old link's (/shared/…) and a request to send documents' (/drop,
    # 5.21; its page is 5.22's). Nothing on
    # them is passed on as a referrer, sniffed, framed, or loaded from
    # anywhere but here (and the fonts); the rest of the app is not sent
    # these, since a signed-in page shows QR codes and pages as data: and
    # blob: images. `always`: an error page is sent them too.
    location ~ ^/s/?$ {
        add_header Cache-Control "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-rl9K4StA5IgHFHux07vfPrLnq7Wy0Tx69i2BhAdWJQs='; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        try_files /index.html =404;
    }

    location ~ ^/drop/?$ {
        add_header Cache-Control "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-rl9K4StA5IgHFHux07vfPrLnq7Wy0Tx69i2BhAdWJQs='; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        try_files /index.html =404;
    }

    # The page a connected app's view link opens (0.9.0, APP3): the drawn
    # pages of one document, for ten minutes, with none of the family's app
    # around it. As a share link's page.
    location ~ ^/a/?$ {
        add_header Cache-Control "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-rl9K4StA5IgHFHux07vfPrLnq7Wy0Tx69i2BhAdWJQs='; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        try_files /index.html =404;
    }

    location ^~ /shared/ {
        add_header Cache-Control "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'sha256-rl9K4StA5IgHFHux07vfPrLnq7Wy0Tx69i2BhAdWJQs='; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        try_files /index.html =404;
    }

    # Hashed assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: every other route serves the shell.
    #
    # Scripts only from here (5.35): a second line of defence behind the app
    # drawing notes as elements, never HTML. Nothing in the app is inline —
    # Vite's build loads its one module by address, and the service worker
    # is /sw.js — but the few lines at the top of index.html that set light
    # or dark before anything is drawn (0.9.0), allowed by their hash alone,
    # here and on the pages above (headers.test.ts holds the hash to the
    # file); and nothing it uses evaluates a string. object-src and
    # base-uri close the two ways round script-src.
    #
    # The ways out a script that ever ran here could use (0.9.0), each shut
    # to all but the vault: connect-src (fetch, XMLHttpRequest, WebSocket,
    # EventSource, sendBeacon — every request the app makes is to its own
    # /api), img-src (an image's address can carry what it read; the app's
    # own are the vault's, or pages and QR codes drawn as data: and blob:)
    # and form-action (a form posted elsewhere). This narrows what such a
    # script could send, not everything: it could still navigate the page
    # away, or open a window, with what it read in the address. Push needs no
    # exception: the browser's own push service takes the subscription, not
    # the page. Fonts and their stylesheet still come from Google, and are
    # not limited here (the pages strangers open, above, have their own
    # strict policy).
    #
    # Never framed (0.9.0): no other site may put the signed-in app in a
    # frame and trick a click on Share or Delete through it. The app frames
    # nothing of its own. No referrer beyond the vault itself, and none of
    # the browser's powers it never uses — on plain :8080 too, where no
    # Caddy adds anything.
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "script-src 'self' 'sha256-rl9K4StA5IgHFHux07vfPrLnq7Wy0Tx69i2BhAdWJQs='; connect-src 'self'; img-src 'self' data: blob:; form-action 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri /index.html;
    }
}
