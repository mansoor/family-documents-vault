# What the access log may say about a request (0.5.0): a share link's, a
# password reset's and an invitation's token are each the whole secret, so
# they are cut; no query string is kept (a share's PIN travels on one, and a
# search's words); no referrer either, which can be a share page's address.
map $request_uri $fdv_log_path {
    "~^(?<fdv_path>[^?]*)" $fdv_path;
}
map $request_uri $fdv_log_query {
    "~\?" "?[redacted]";
    default "";
}
map $fdv_log_path $fdv_log_uri {
    "~^(?<fdv_pre>/api/v1/(?:shared|password-resets|invitations)/)[^/]+(?<fdv_rest>.*)$" "${fdv_pre}[redacted]${fdv_rest}";
    "~^(?<fdv_pre2>/(?:shared|reset|join)/)[^/]+(?<fdv_rest2>.*)$" "${fdv_pre2}[redacted]${fdv_rest2}";
    default $fdv_log_path;
}
log_format fdv_redacted '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $fdv_log_uri$fdv_log_query $server_protocol" '
                        '$status $body_bytes_sent "-" "$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    access_log /var/log/nginx/access.log fdv_redacted;
    # nginx's error lines repeat the raw request, secret and all ("connect()
    # failed ... request: GET /api/v1/shared/<token>..."), and their format
    # cannot be changed. Only critical ones are kept: the API being away
    # still shows, as a 502 or 504 in the access log above.
    error_log /var/log/nginx/error.log crit;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads can be large; the API enforces its own limit.
    client_max_body_size 512m;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    location /api/ {
        proxy_pass http://api:3000;
    }

    location = /healthz {
        proxy_pass http://api:3000;
    }

    location = /readyz {
        proxy_pass http://api:3000;
    }

    # The pages people outside the family open (5.16): a share link's (/s)
    # and an old link's (/shared/…); /drop joins them in 5.22. Nothing on
    # them is passed on as a referrer, sniffed, framed, or loaded from
    # anywhere but here (and the fonts); the rest of the app is not sent
    # these, since a signed-in page shows QR codes and pages as data: and
    # blob: images. `always`: an error page is sent them too.
    location ~ ^/s/?$ {
        add_header Cache-Control "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        try_files /index.html =404;
    }

    location ^~ /shared/ {
        add_header Cache-Control "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        try_files /index.html =404;
    }

    # Hashed assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: every other route serves the shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
