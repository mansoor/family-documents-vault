# The master key from a file, as a Docker secret, instead of from .env.
# Use together with the main file (and the TLS file, if you use it):
#
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
#
# or put COMPOSE_FILE=docker-compose.yml:docker-compose.secrets.yml in .env
# once, and every plain `docker compose` command uses both.
#
# The key is then in no container's environment, where `docker inspect` and
# any process of the same user inside it can read it: the migrate service,
# the api and the worker each read it from /run/secrets/fdv_master_key. See
# the README, "Keeping the master key in a file", for moving an existing
# vault's key into the file — the same key, never a new one.
#
# The file (./secrets/fdv_master_key unless FDV_MASTER_KEY_SECRET names
# another) holds the key alone, on one line, readable by uid 1000, the user
# the api and the worker run as. Remove FDV_MASTER_KEY from .env once it is
# there: both may be set while you move, but only to the same key — the
# vault refuses to start on two different ones.

services:
  migrate:
    environment:
      FDV_MASTER_KEY_FILE: /run/secrets/fdv_master_key
    secrets:
      - fdv_master_key
  api:
    environment:
      FDV_MASTER_KEY_FILE: /run/secrets/fdv_master_key
    secrets:
      - fdv_master_key
  worker:
    environment:
      FDV_MASTER_KEY_FILE: /run/secrets/fdv_master_key
    secrets:
      - fdv_master_key

secrets:
  fdv_master_key:
    file: ${FDV_MASTER_KEY_SECRET:-./secrets/fdv_master_key}
